    const mx=new THREE.AnimationMixer(g),A={};for(const c of M.golem.animations)A[c.name]=mx.clipAction(c);mixers.push(mx);let cur=A.Idle;cur&&cur.play();
    const gp=n=>{const a=A[n];if(!a)return;a.reset().setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;a.play();cur.crossFadeTo(a,0.2,false);setTimeout(()=>{A.Idle.reset().play();a.crossFadeTo(A.Idle,0.3,false);cur=A.Idle},a.getClip().duration*1000-150)};
    setInterval(()=>gp(Math.random()<0.5?'Earthquake':'RockDrops'),7000);tags.push({o:g,el:mkTag('Golem de Pedra (novo)'),h:3.3})}
  window.__merge=mergeStatic();console.log('merge',JSON.stringify(window.__merge));
  setSky();loop();
  setInterval(()=>{if(knight)knight.play('Sword_Regular_Combo',true);setTimeout(()=>knight&&knight.play('Idle_Shield_Loop'),2600);
    if(warrior)warrior.play('Sword_Heavy_Combo',true);setTimeout(()=>warrior&&warrior.play('Sword_Idle'),3200)},6000);
  window.__P={S,C,R,ctl,M,LODS,step:n=>{for(let i=0;i<n;i++)tick(0.033)},setNight:v=>{night=v;setSky()},render:()=>R.render(S,C)};window.__ready=1;
}
// ===== laço =====
const clock=new THREE.Clock();let t=0,fA=0,fN=0;const fpsEl=document.getElementById('fps'),tv=new THREE.Vector3();
function tick(dt){t+=dt;for(const m of mixers)m.update(dt);
  if(walker){const a=t*0.35,r=9;walker.m.position.set(Math.cos(a)*r,0,Math.sin(a)*r);walker.m.rotation.y=-a+Math.PI;}
  for(const L of LODS){const far=C.position.distanceTo(L.m.position)>LOD_D;if(far!==L.far){L.far=far;for(const x of L.lod)x.o.geometry=far?x.lo:x.hi}}
  ctl.update()}
function loop(){requestAnimationFrame(loop);const dt=Math.min(0.05,clock.getDelta());tick(dt);R.render(S,C);
  for(const g of tags){tv.setFromMatrixPosition(g.o.matrixWorld);tv.y+=g.h;tv.project(C);const vis=tv.z<1&&Math.abs(tv.x)<1.1&&Math.abs(tv.y)<1.1;g.el.style.display=vis?'':'none';if(vis){g.el.style.left=((tv.x+1)/2*innerWidth)+'px';g.el.style.top=((1-tv.y)/2*innerHeight)+'px'}}
  fA+=dt;fN++;if(fA>=0.5){fpsEl.textContent=Math.round(fN/fA)+' FPS · '+R.info.render.calls+' desenhos · '+Math.round(R.info.render.triangles/1000)+' mil triângulos';fA=0;fN=0}}
document.querySelectorAll('[data-q]').forEach(b=>{b.classList.toggle('on',b.dataset.q===Q.q);b.onclick=()=>{try{localStorage.setItem('aether_proto_q',b.dataset.q)}catch(e){}location.reload()}});
